name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-distro-libyang:
    name: Linux (distro libyang 2.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config qt6-base-dev libgl-dev libyang2-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-latest-libyang:
    name: Linux (latest libyang from source)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config qt6-base-dev libgl-dev libpcre2-dev
      - name: Build libyang (latest release tag)
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/CESNET/libyang \
                | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Using libyang $TAG"
          git clone --depth 1 -b "$TAG" https://github.com/CESNET/libyang ly
          cmake -S ly -B ly/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_TESTS=OFF -DCMAKE_INSTALL_PREFIX=$HOME/ly
          cmake --build ly/build
          cmake --install ly/build
      - name: Configure
        run: |
          PKG_CONFIG_PATH=$HOME/ly/lib/pkgconfig:$HOME/ly/lib64/pkgconfig \
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          export LD_LIBRARY_PATH=$HOME/ly/lib:$HOME/ly/lib64
          ctest --test-dir build --output-on-failure
